# Netlify build config for the Next.js frontend.
#
# This is a monorepo: `frontend/` and `cms/` are separate npm packages and there
# is no root package.json, so `base` has to point Netlify at frontend/ before it
# installs or builds anything. `publish` is resolved relative to `base`.
#
# Only the frontend is deployed here. The Payload CMS is an Express server that
# needs a long-running process and PostgreSQL, which Netlify cannot host — it is
# deployed separately and reached over NEXT_PUBLIC_CMS_URL / CMS_URL.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 14.2 requires >= 18.17; pin so a Netlify default bump can't change the
  # build out from under us.
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security response headers for anything Netlify serves directly (static files
# in /public, redirects). SSR/ISR pages bypass this block entirely — Netlify's
# Next.js runtime answers those from its own function — so the same headers are
# also declared in frontend/next.config.mjs, which is what actually covers the
# pages. Keep the two lists in sync.
[[headers]]
  for = "/*"
  [headers.values]
    # 1 year, subdomains included — the site is HTTPS-only behind Netlify.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # No framing: kills clickjacking of the quote form.
    X-Frame-Options = "DENY"
    # Don't let a browser second-guess a declared Content-Type.
    X-Content-Type-Options = "nosniff"
    # Send the origin (not the full path) to third parties.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # We ask for none of these — deny by default.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Legacy Flash/PDF cross-domain policy files are never valid here.
    X-Permitted-Cross-Domain-Policies = "none"
